<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">Srishanth Goud — curiosity in, working software out.</title>
  <desc id="desc">A dark engineering workspace with lime typography and a softly animated circuit orbit. AI tools, web products, and Android experiments. Build, ship, repeat.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111a26"/>
      <stop offset="1" stop-color="#0b1018"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#c7f284" stop-opacity=".13"/>
      <stop offset="1" stop-color="#c7f284" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#253245" stroke-width=".65"/>
    </pattern>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .trace { animation: trace 18s linear infinite; }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    .cursor { animation: cursor 2.4s steps(2, jump-none) infinite; }
    @keyframes trace { to { stroke-dashoffset: -96; } }
    @keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
    @keyframes cursor { 0%, 65% { opacity: 1; } 100% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) {
      .trace, .pulse, .cursor { animation: none !important; }
    }
  </style>
  <rect x=".5" y=".5" width="1099" height="389" rx="22" fill="url(#surface)" stroke="#253245"/>
  <rect x="721" y="24" width="353" height="268" rx="16" fill="url(#grid)" opacity=".5"/>
  <path d="M48 88H656" stroke="#253245"/>
  <rect x="48" y="47" width="8" height="8" rx="2" fill="#c7f284"/>
  <text x="69" y="57" class="sans" font-size="15" font-weight="650" fill="#edf3fa" letter-spacing="1.5">SRISHANTH GOUD</text>
  <text x="263" y="57" class="mono" font-size="13" font-weight="400" fill="#9baabe" >/ @iamsrishanth</text>
  <text x="48" y="163" class="sans" font-size="58" font-weight="650" fill="#edf3fa" letter-spacing="-2">Curiosity in.</text>
  <text x="48" y="227" class="sans" font-size="54" font-weight="650" fill="#c7f284" letter-spacing="-2">Working software out.</text>
  <text x="50" y="270" class="sans" font-size="18" font-weight="400" fill="#9baabe" >AI tools · web products · Android experiments</text>
  <g transform="translate(888 167) scale(0.85)">
    <circle r="169" fill="url(#halo)"/>
    <circle r="127" stroke="#253245" fill="none"/>
    <circle r="102" stroke="#253245" fill="none" stroke-dasharray="2 9"/>
    <path d="M-150 0H150 M0-150V150" stroke="#253245" stroke-dasharray="3 8"/>
    <ellipse rx="145" ry="56" transform="rotate(-34)" stroke="#c7f284" stroke-opacity=".28" fill="none"/>
    <ellipse rx="145" ry="56" transform="rotate(34)" stroke="#88d8ff" stroke-opacity=".34" fill="none"/>
    <ellipse class="trace" rx="145" ry="56" transform="rotate(-34)" stroke="#c7f284" stroke-width="1.3" stroke-dasharray="12 84" fill="none"/>
    <path d="M-120-71H-72L-44-43 M115-67H73L44-38 M-110 87H-73L-42 45 M115 73H73L43 43" stroke="#253245" stroke-width="1.5" fill="none"/>
    <rect x="-47" y="-47" width="94" height="94" rx="20" fill="#0b1018" stroke="#c7f284" stroke-opacity=".45"/>
    <rect x="-38" y="-38" width="76" height="76" rx="13" fill="#111a26" stroke="#253245"/>
    <path d="M-13-13L-26 0L-13 13 M13-13L26 0L13 13 M5-19L-5 19" stroke="#c7f284" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g stroke="#253245" stroke-width="2">
      <path d="M-23-56V-47 M0-56V-47 M23-56V-47 M-23 47V56 M0 47V56 M23 47V56 M-56-23H-47 M-56 0H-47 M-56 23H-47 M47-23H56 M47 0H56 M47 23H56"/>
    </g>
    <circle cx="-120" cy="-71" r="6" fill="#0b1018" stroke="#c7f284" stroke-width="2"/>
    <circle cx="115" cy="-67" r="5" fill="#0b1018" stroke="#88d8ff" stroke-width="2"/>
    <circle cx="-110" cy="87" r="5" fill="#0b1018" stroke="#b7a3ff" stroke-width="2"/>
    <circle cx="115" cy="73" r="6" fill="#0b1018" stroke="#c7f284" stroke-width="2"/>
    <circle class="pulse" cx="115" cy="73" r="11" fill="none" stroke="#c7f284" stroke-opacity=".3"/>
    <text x="-127" y="-88" class="mono" font-size="9" font-weight="400" fill="#9baabe" >EXPLORE</text><text x="81" y="-84" class="mono" font-size="9" font-weight="400" fill="#9baabe" >BUILD</text><text x="84" y="98" class="mono" font-size="9" font-weight="400" fill="#9baabe" >SHIP</text>
  </g>
  <path d="M48 311H1052" stroke="#253245"/>
  <text x="48" y="348" class="mono" font-size="18" font-weight="400" fill="#c7f284" >&gt;</text>
  <text x="72" y="348" class="mono" font-size="15" font-weight="400" fill="#edf3fa" >build · ship · repeat</text>
  <rect class="cursor" x="274" y="333" width="8" height="18" rx="1" fill="#c7f284"/>
  <text x="1052" y="348" class="mono" font-size="11" font-weight="400" fill="#9baabe" text-anchor="end" letter-spacing="1.4">IDEAS BECOME INTERFACES</text>

